[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["data", "samples"]

[tool.ruff.lint]
# Pyflakes errors (F) and the basic pycodestyle errors (E4, E7, E9).
select = ["E4", "E7", "E9", "F"]
